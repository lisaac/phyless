name: Build and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.ref_type != 'tag'
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          # No native runners; Go cross-compiles, only the alpine stage runs under QEMU.
          - { runner: ubuntu-24.04, platform: linux/arm/v7, arch: armv7, qemu: true }
          - { runner: ubuntu-24.04, platform: linux/386, arch: "386", qemu: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
      - name: Build image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker build --platform "$PLATFORM" --build-arg GIT_COMMIT="$GITHUB_SHA" -t phyless:ci .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          image_name="${IMAGE_NAME,,}"
          docker tag phyless:ci "$image_name:latest-$ARCH"
          docker push "$image_name:latest-$ARCH"

  docker-manifest:
    needs: docker
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-arch latest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="${IMAGE_NAME,,}"
          docker buildx imagetools create -t "$image_name:latest" \
            "$image_name:latest-amd64" "$image_name:latest-arm64" \
            "$image_name:latest-armv7" "$image_name:latest-386"
          docker buildx imagetools inspect "$image_name:latest"

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm, goarm: "7", cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: "386", cgo: "0" }
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: "1" } # fsevents needs CGO, so build natively.
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build frontend
        working-directory: frontend
        run: npm ci && GIT_COMMIT="$GITHUB_SHA" npm run build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p backend/web/dist dist/licenses
          cp -R frontend/dist/. backend/web/dist/
          # Every binary embeds BusyBox (GPL-2.0): ship its notice and license.
          cp LICENSE backend/internal/docker/debugshell/busybox-NOTICE.md backend/internal/docker/debugshell/busybox-COPYING dist/licenses/
          name="phyless-$GOOS-$GOARCH${GOARM:+v$GOARM}" # arm + GOARM=7 -> armv7
          if [ "$GOOS" = windows ]; then
            ./scripts/go-build.sh -o "dist/$name.exe" ./backend/cmd/server/
            (cd dist && zip -r "$name.zip" "$name.exe" licenses)
          else
            ./scripts/go-build.sh -o "dist/$name" ./backend/cmd/server/
            tar -C dist -czf "dist/$name.tar.gz" "$name" licenses
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: phyless-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # GPL-2.0 §3: the BusyBox the binaries embed gets its corresponding
      # source from the same place (upstream tarball + Alpine's build recipe).
      - name: BusyBox corresponding source
        run: ./scripts/fetch-busybox.sh --source dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi

name: Build and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t phyless:ci .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="${IMAGE_NAME,,}"
          docker tag phyless:ci "$image_name:latest"
          docker push "$image_name:latest"

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: "1" } # fsevents needs CGO, so build natively.
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build frontend
        working-directory: frontend
        run: npm ci && GIT_COMMIT="$GITHUB_SHA" npm run build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p backend/web/dist dist
          cp -R frontend/dist/. backend/web/dist/
          name="phyless-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            ./scripts/go-build.sh -o "dist/$name.exe" ./backend/cmd/server/
            (cd dist && zip "$name.zip" "$name.exe")
          else
            ./scripts/go-build.sh -o "dist/$name" ./backend/cmd/server/
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: phyless-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi

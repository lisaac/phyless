name: Build and publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t phyless:ci .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="${IMAGE_NAME,,}"
          docker tag phyless:ci "$image_name:latest"
          docker push "$image_name:latest"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build release archive
        run: |
          docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t phyless:release .
          container=$(docker create phyless:release)
          mkdir dist
          docker cp "$container:/app/phyless" dist/phyless-linux-amd64
          docker rm "$container"
          tar -C dist -czf dist/phyless-linux-amd64.tar.gz phyless-linux-amd64
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/phyless-linux-amd64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/phyless-linux-amd64.tar.gz --generate-notes
          fi

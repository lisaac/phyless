name: Build and publish demo

on:
  push:
    branches: [gh-pages]
    paths:
      - demo/**
      - .github/workflows/build-demo.yml
  workflow_call:
    inputs:
      source_ref:
        description: Main branch commit to build
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || 'main' }}
          path: source

      - name: Check out demo branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Check demo mocks
        run: node pages/demo/smoke.test.mjs

      - name: Build static demo
        run: bash pages/demo/build.sh "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/phyless-demo-dist"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/phyless-demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

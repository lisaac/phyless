services:
  phyless:
    build:
      context: .
      dockerfile: Dockerfile
    image: phyless:latest
    command: ["./phyless", "-C", "/data"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - /srv:/srv
    restart: unless-stopped
